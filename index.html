<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCSP Notes Practice Exam</title>
<style>
:root{
  --navy:#1a2b4c; --blue:#0057a3; --green:#1e824c; --amber:#c98e00; --red:#b3261e;
  --bg:#f4f6f9; --card:#ffffff; --border:#d9dee5; --text:#1c2530; --muted:#5a6472;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);}
header{background:var(--navy);color:#fff;padding:18px 24px;}
header h1{margin:0;font-size:1.25rem;}
header p{margin:4px 0 0;font-size:.85rem;color:#c9d3e0;}
.container{max-width:860px;margin:0 auto;padding:24px 16px 60px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:22px 24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
button{cursor:pointer;font-size:.95rem;border:none;border-radius:6px;padding:10px 20px;background:var(--blue);color:#fff;font-weight:600;}
button:hover{background:#00427d;}
button.secondary{background:#fff;color:var(--blue);border:1px solid var(--blue);}
button.secondary:hover{background:#eef4fb;}
button.small{padding:6px 14px;font-size:.82rem;}
button:disabled{background:#aab4bf;cursor:not-allowed;}
.qnum{font-weight:700;color:var(--blue);margin-right:6px;}
.qtext{font-weight:600;margin-bottom:10px;line-height:1.4;}
.opt{display:block;padding:9px 12px;margin:6px 0;border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:.15s;}
.opt:hover{background:#f0f4f9;}
.opt input{margin-right:10px;}
.opt.selected{border-color:var(--blue);background:#eaf1fb;}
.opt.reveal-correct{border-color:var(--green);background:#e5f5ec;font-weight:600;}
.opt.reveal-wrong-selected{border-color:var(--red);background:#fde8e8;}
.progress-wrap{position:sticky;top:0;background:var(--bg);padding:10px 0 6px;z-index:10;}
.progress-bar{height:8px;background:#dde3ea;border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:var(--blue);width:0%;transition:width .2s;}
.progress-label{font-size:.8rem;color:var(--muted);margin-top:4px;text-align:right;}
.nav-row{display:flex;justify-content:space-between;margin-top:18px;}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:700;color:#fff;}
.pill.EXEMPLARY{background:var(--green);}
.pill.COMPETENT{background:var(--blue);}
.pill.APPROACHING{background:var(--amber);}
.pill.NOTCOMPETENT{background:var(--red);}
.comp-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.comp-row:last-child{border-bottom:none;}
.comp-name{flex:1;font-weight:600;font-size:.92rem;}
.comp-pct{font-size:.82rem;color:var(--muted);margin-right:10px;}
.answer-block{border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:14px;}
.answer-block.correct{border-left:5px solid var(--green);}
.answer-block.incorrect{border-left:5px solid var(--red);}
.ans-opt{padding:6px 10px;border-radius:5px;margin:3px 0;font-size:.9rem;}
.ans-opt.your{background:#fde8e8;border:1px solid var(--red);}
.ans-opt.correctans{background:#e5f5ec;border:1px solid var(--green);font-weight:600;}
.ans-opt.both{background:#e5f5ec;border:1px solid var(--green);font-weight:600;}
.tag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);}
.summary-score{font-size:2.4rem;font-weight:800;color:var(--navy);}
.status-pass{color:var(--green);}
.status-fail{color:var(--red);}
.hidden{display:none;}
.desc{font-size:.92rem;line-height:1.5;color:var(--muted);}
.filterbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.filterbar button{padding:6px 14px;font-size:.8rem;background:#fff;color:var(--blue);border:1px solid var(--blue);}
.filterbar button.active{background:var(--blue);color:#fff;}
.explain-box{margin-top:12px;padding:12px 14px;background:#f0f6ff;border:1px solid #b9d3ef;border-radius:6px;font-size:.88rem;line-height:1.5;color:#1c2530;}
.explain-box strong{color:var(--navy);}
.explain-toggle-row{margin-top:10px;text-align:right;}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding:20px 0;}
</style>
</head>
<body>
<header>
  <h1>CCSP Notes Practice Exam</h1>
  <p>80-question practice exam built entirely from your CCSP study notes &middot; Coaching Report style results</p>
</header>
<div class="container" id="app"></div>
<footer>Practice exam generated for personal study use from your uploaded CCSP notes.</footer>

<script>
const COMPETENCIES = {
  "Arch":     {name:"Architectural Concepts &amp; Design", weight:20},
  "Data":     {name:"Data Classification &amp; Cloud Data Security", weight:20},
  "SecResp":  {name:"Security in the Cloud &amp; Responsibilities", weight:13},
  "App":      {name:"Cloud Application Security", weight:16},
  "Ops":      {name:"Operations Elements &amp; Management", weight:16},
  "Legal":    {name:"Legal, Compliance &amp; Risk", weight:16}
};

const QUESTIONS = [{"n": 1, "cat": "Arch", "text": "In the NIST cloud computing model, which characteristic allows customers to unilaterally provision computing resources without requiring human interaction with the service provider?", "opts": ["Rapid elasticity", "On-demand self-service", "Broad network access", "Resource pooling"], "correct": 1, "expl": "On-demand self-service is the cloud characteristic that lets customers provision resources themselves without needing to interact with the provider's staff."}, {"n": 2, "cat": "Arch", "text": "What does the term 'elasticity' refer to in cloud computing?", "opts": ["Paying only for resources actually consumed", "Using virtualization to flexibly allocate only the needed usage of each resource while holding down costs", "Renting extra capacity from an outside provider during a demand spike", "Increasing or decreasing services quickly and cost-effectively"], "correct": 1, "expl": "Elasticity lets customers use virtualization to flexibly allocate only the resources they need, holding costs down while maintaining profitability and increasing accessibility."}, {"n": 3, "cat": "Arch", "text": "Which cloud service model is described as the 'most basic service,' where the customer installs all software and operating systems on hardware housed by the vendor, and which can serve as a warm site for BC/DR?", "opts": ["SaaS", "PaaS", "IaaS", "FaaS"], "correct": 2, "expl": "IaaS is the most basic and least expensive service model. The customer retains IT staffing and installs their own OS/software, and it can serve as a warm site for business continuity/disaster recovery."}, {"n": 4, "cat": "Arch", "text": "In PaaS, who is responsible for patching, administering, and updating the operating system?", "opts": ["The customer", "The vendor", "A shared responsibility between customer and vendor", "A third-party CASB"], "correct": 1, "expl": "Under PaaS, the vendor offers a selection of OSs and is responsible for patching, administering, and updating them, while the customer can install any software on top."}, {"n": 5, "cat": "Arch", "text": "Which type of data is quantitative, organized, and decipherable by machine learning algorithms, often stored and queried using SQL?", "opts": ["Unstructured data", "Semi-structured data", "Structured data", "Metadata"], "correct": 2, "expl": "Structured data is quantitative and organized so that relational (SQL) systems and machine learning algorithms can quickly input, search, and manipulate it."}, {"n": 6, "cat": "Arch", "text": "In a public cloud deployment, what does 'multitenant' mean?", "opts": ["Only one customer uses the entire physical environment", "Multiple customers share resources on the same underlying hardware, without necessarily knowing who else is using it", "Customers are limited to a single geographic tenant region", "Tenants must use identical operating systems"], "correct": 1, "expl": "Public clouds are multitenant environments — multiple customers, who may even be competitors, might share the same underlying hardware without knowing it."}, {"n": 7, "cat": "Arch", "text": "Which cloud deployment model can be provisioned by a third party and, when restricted to US federal government use, is associated with FedRAMP?", "opts": ["Public cloud", "Private cloud", "Community cloud", "Hybrid cloud"], "correct": 2, "expl": "Community cloud infrastructure is owned/operated by or for an affinity group and can be provisioned by a third party; a FedRAMP-based community cloud service is restricted to US federal government use."}, {"n": 8, "cat": "Arch", "text": "Which role purchases hosting services from a cloud provider and resells them to its own customers?", "opts": ["Cloud carrier", "Cloud broker", "Regulator", "Cloud auditor"], "correct": 1, "expl": "A cloud broker is a company that purchases hosting services from a provider and resells them to its own customer base."}, {"n": 9, "cat": "Arch", "text": "A CASB can provide which of the following services to cloud customers?", "opts": ["Only intrusion detection", "SSO, certificate management, and cryptographic key escrow", "Only physical data center security", "Only vulnerability scanning"], "correct": 1, "expl": "A CASB (Cloud Access Security Broker) is a third-party entity offering independent identity and access management services, which can include SSO, certificate management, and cryptographic key escrow."}, {"n": 10, "cat": "Arch", "text": "Which threat modeling framework categorizes threats as Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, and Elevation of Privilege?", "opts": ["OWASP Top 10", "CIA Triad", "STRIDE", "CCM"], "correct": 2, "expl": "STRIDE is a threat model that stands for Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, and Elevation of Privilege."}, {"n": 11, "cat": "Arch", "text": "Which theoretical encryption concept would let a cloud customer process encrypted data without decrypting it first, avoiding the need to share keys with the provider?", "opts": ["Format-preserving encryption", "Homomorphic encryption", "Proxy re-encryption (PRE)", "Whole-disk encryption"], "correct": 1, "expl": "Homomorphic encryption is a theoretical phenomenon allowing processing of encrypted material without first decrypting it, letting customers keep data usable without sharing keys with the provider."}, {"n": 12, "cat": "Arch", "text": "Which risk treatment strategy is described as 'the opposite of avoidance,' where the risk falls within the organization's risk appetite and operations continue without additional effort?", "opts": ["Mitigation", "Transference", "Acceptance", "Residual risk"], "correct": 2, "expl": "Acceptance is the opposite of avoidance — when a risk falls within the organization's risk appetite, the organization continues operations without additional controls."}, {"n": 13, "cat": "Arch", "text": "When an organization takes steps to decrease the likelihood or impact of a risk through controls and countermeasures, which risk treatment strategy is being used?", "opts": ["Avoidance", "Mitigation", "Transference", "Acceptance"], "correct": 1, "expl": "Mitigation involves taking steps — typically controls and countermeasures implemented by security practitioners — to decrease the likelihood or impact of a risk."}, {"n": 14, "cat": "Arch", "text": "Under which cloud service model does the customer retain the most responsibility and authority, since the provider is only responsible for the building, land, connectivity, power, and hardware?", "opts": ["SaaS", "PaaS", "IaaS", "DaaS"], "correct": 2, "expl": "Under IaaS, the customer has the most responsibility and authority; the provider is only responsible for the physical building, land, connectivity, power, and hardware assets."}, {"n": 15, "cat": "Arch", "text": "Which term describes the profitability ratio calculated by dividing net profits by net assets?", "opts": ["ALE", "SLE", "ARO", "ROI"], "correct": 3, "expl": "ROI (Return on Investment) is a profitability ratio calculated by dividing net profits by net assets, used in cost-benefit analysis of cloud decisions."}, {"n": 16, "cat": "Data", "text": "Which role is legally responsible for data at all times, even though a cloud provider may physically store or process it?", "opts": ["Data custodian", "Data processor", "Data owner", "Cloud carrier"], "correct": 2, "expl": "The data owner — usually a department head or business unit manager — remains legally responsible for all data they own, regardless of who processes it."}, {"n": 17, "cat": "Data", "text": "What is the correct order of the data lifecycle according to the CCSP framework?", "opts": ["Create, Use, Store, Share, Destroy, Archive", "Create, Store, Use, Share, Archive, Destroy", "Store, Create, Use, Archive, Share, Destroy", "Create, Archive, Store, Use, Share, Destroy"], "correct": 1, "expl": "The data lifecycle proceeds in this order: Create, Store, Use, Share, Archive, Destroy."}, {"n": 18, "cat": "Data", "text": "During the Create phase of the data lifecycle, what key action does the data owner take?", "opts": ["Encrypt the data automatically", "Categorize and classify the data", "Archive the data for long-term storage", "Destroy any duplicate copies"], "correct": 1, "expl": "The Create phase is when the data owner is identified and takes on the responsibility of categorizing and classifying the data."}, {"n": 19, "cat": "Data", "text": "Which data categorization method organizes datasets specifically around regulatory frameworks such as GLBA, PCI, SOX, HIPAA, and GDPR?", "opts": ["Business function", "Functional unit", "By project", "Regulatory compliance"], "correct": 3, "expl": "Regulatory compliance categorization organizes data around specific regulated datasets like GLBA, PCI, SOX, HIPAA, and GDPR."}, {"n": 20, "cat": "Data", "text": "Which data classification factor depends on the geophysical location of the data's source or storage point, such as PII from EU citizens being subject to EU privacy laws?", "opts": ["Sensitivity", "Jurisdiction", "Criticality", "Mapping"], "correct": 1, "expl": "Jurisdiction as a classification factor is based on the geophysical location where the data originates or is stored, which determines which laws apply to it."}, {"n": 21, "cat": "Data", "text": "A data label should indicate who the data owner is. How should this be represented?", "opts": ["By the individual's full legal name", "By their personal email address", "By office or role, not personal name or identity", "It should not be represented at all"], "correct": 2, "expl": "Labels should indicate the data owner by role or office, not by the individual's personal name or identity, to avoid disclosing personal information the label describes."}, {"n": 22, "cat": "Data", "text": "Which type of data discovery uses basic term searches or sophisticated pattern-matching to locate specific kinds of data by examining the actual content of datasets, even without labels or metadata?", "opts": ["Label-based discovery", "Metadata-based discovery", "Content-based discovery", "E-discovery"], "correct": 2, "expl": "Content-based discovery uses term searches or pattern-matching technologies to identify data by delving directly into dataset content, without relying on labels or metadata."}, {"n": 23, "cat": "Data", "text": "Which intellectual property protection lasts approximately 20 years from the date of the patent application and covers inventions, processes, and materials?", "opts": ["Copyright", "Trademark", "Patent", "Trade secret"], "correct": 2, "expl": "Patents protect inventions, processes, materials, decorations, and plant life, and last about 20 years from the time of the patent application."}, {"n": 24, "cat": "Data", "text": "Which IRM-in-the-cloud complication arises because cloud extends across boundaries and borders where intellectual property rights are restricted differently by locale?", "opts": ["Replication restrictions", "Jurisdictional conflicts", "Agent/enterprise conflicts", "API conflicts"], "correct": 1, "expl": "Jurisdictional conflicts occur because the cloud extends across boundaries and borders, and intellectual property rights protections vary by locale."}, {"n": 25, "cat": "Data", "text": "Which IRM function allows content creators and data owners to modify access control lists and permissions for data under their control?", "opts": ["Persistent protection", "Dynamic policy control", "Automatic expiration", "Continuous auditing"], "correct": 1, "expl": "Dynamic policy control is the IRM function that should allow content creators and data owners to modify ACLs and permissions for their protected data."}, {"n": 26, "cat": "Data", "text": "During the Destroy phase of the data lifecycle in a cloud environment, which method is considered the sole pragmatic option since hardware destruction or overwriting is nearly impossible?", "opts": ["Degaussing", "Physical shredding", "Wiping", "Crypto-shredding"], "correct": 3, "expl": "Because hardware destruction or overwriting storage is nearly impossible in the cloud, crypto-shredding (cryptographic erasure) is the sole pragmatic disposal option."}, {"n": 27, "cat": "Data", "text": "What is the process of crypto-shredding, as described in the cloud data security notes?", "opts": ["Overwriting data seven times with random characters", "Encrypting the data, then encrypting the resulting keys with a different engine, then destroying those second-round keys", "Physically degaussing the storage medium", "Deleting the file pointer without touching the underlying bits"], "correct": 1, "expl": "Crypto-shredding encrypts the data with one engine, encrypts the resulting keys with a different encryption engine, and then destroys the second round of encryption keys, rendering the data unrecoverable."}, {"n": 28, "cat": "Data", "text": "Which US export control law, enforced by the Department of Commerce, restricts export of dual-use items — technologies with both commercial and military applications?", "opts": ["ITAR", "EAR", "The Wassenaar Arrangement", "CLOUD Act"], "correct": 1, "expl": "EAR (Export Administration Regulations) is enforced by the Department of Commerce and restricts dual-use item exports, including certain cryptography systems."}, {"n": 29, "cat": "Data", "text": "Which storage architecture is described as a 'blank volume' the customer can put anything into, offering low latency and high performance, but requiring greater administrative effort?", "opts": ["Object-based storage", "File-based storage", "Block storage", "Ephemeral storage"], "correct": 2, "expl": "Block storage provides low latency and high performance as a blank volume, requiring the customer to install an OS or app to store, sort, and retrieve data — better suited to services like enterprise backups."}, {"n": 30, "cat": "Data", "text": "Which storage type is best suited for large amounts of unstructured data, includes metadata describing content plus a unique address identifier, and enhances indexing and DLP/IRM enforcement?", "opts": ["Volume storage", "Object-based storage", "SAN storage", "NAS storage"], "correct": 1, "expl": "Object-based storage is designed for large unstructured data, including production content, descriptive metadata, and a unique address identifier, which supports indexing, labeling, and policy enforcement."}, {"n": 31, "cat": "Data", "text": "Which storage type is analogous to RAM for a cloud VM, referred to as instance store volumes, and results in permanent data loss if the VM shuts down?", "opts": ["Long-term storage", "Ephemeral storage", "Archival storage", "Block storage"], "correct": 1, "expl": "Ephemeral storage is temporary — referred to as instance store volumes — and behaves like RAM for a cloud VM, meaning data is lost if the VM instance shuts down or the physical drive fails."}, {"n": 32, "cat": "Data", "text": "Which device is described as far stronger than storing encryption keys in software, safely storing and managing keys used in servers, data transmission, and log files?", "opts": ["TPM", "HSM", "CASB", "SIEM"], "correct": 1, "expl": "An HSM (Hardware Security Module) is a device that safely stores and manages encryption keys and is far stronger than storing keys in software."}, {"n": 33, "cat": "Data", "text": "Which data protection technique replaces sensitive data in transit while leaving the original at-rest data unaltered?", "opts": ["Static Data Masking (SDM)", "Dynamic Data Masking (DDM)", "Tokenization", "Randomization"], "correct": 1, "expl": "Dynamic Data Masking (DDM) replaces sensitive data while it is in transit, but leaves the original data at rest unaltered — as opposed to SDM, which permanently alters data at rest."}, {"n": 34, "cat": "Data", "text": "Which technique maintains two distinct databases — one holding live, actual sensitive data and one holding nonrepresentational tokens mapped to that data — authenticated via a token server?", "opts": ["Masking", "Anonymization", "Tokenization", "Shuffling"], "correct": 2, "expl": "Tokenization uses two distinct databases: one with the real sensitive data, and one with nonrepresentational tokens mapped to it, with access authenticated through a token server."}, {"n": 35, "cat": "Data", "text": "What are the two main goals of implementing egress monitoring (DLP) tools according to the notes?", "opts": ["Centralizing log collection and dashboarding", "Enhancing monitoring and regulatory compliance while examining data as it leaves the production environment", "Increasing storage capacity and reducing latency", "Automating VM provisioning and orchestration"], "correct": 1, "expl": "Egress monitoring (DLP) tools examine data as it leaves the production environment, with major goals including additional security, policy enforcement, enhanced monitoring, and regulatory compliance."}, {"n": 36, "cat": "SecResp", "text": "Which cloud risk specifically involves a customer being unable to leave, migrate, or transfer their data to another provider due to technical or nontechnical constraints such as proprietary formats?", "opts": ["Vendor lock-out", "Vendor lock-in", "Data seizure", "Regulatory failure"], "correct": 1, "expl": "Vendor lock-in occurs when a customer cannot leave, migrate, retrieve, or transfer their data to an alternate provider, often due to proprietary data formats or restrictive contract terms."}, {"n": 37, "cat": "SecResp", "text": "What is 'data portability' used to prevent?", "opts": ["Vendor lock-out", "Vendor lock-in", "Regulatory noncompliance", "Guest escape"], "correct": 1, "expl": "Data portability is used specifically to avoid vendor lock-in by making it easier to move data from one cloud provider to another."}, {"n": 38, "cat": "SecResp", "text": "Which situation occurs when a cloud provider goes bankrupt, is bought out, or ceases operations, preventing the customer from recovering their own data?", "opts": ["Vendor lock-in", "Vendor lock-out", "Data dispersion", "Inadvertent disclosure"], "correct": 1, "expl": "Vendor lock-out happens when a customer cannot access or recover their own data because the provider has gone out of business, been acquired, or ceased operations."}, {"n": 39, "cat": "SecResp", "text": "Which type of hypervisor resides directly on the host machine as bootable software and is also called a bare-metal hypervisor?", "opts": ["Type 1", "Type 2", "VMI", "NFV"], "correct": 0, "expl": "A Type 1 hypervisor, also known as a bare-metal or hardware hypervisor, resides directly on the host machine as bootable software."}, {"n": 40, "cat": "SecResp", "text": "What distinguishes a Type 2 hypervisor from a Type 1 hypervisor?", "opts": ["Type 2 is a hardware-based hypervisor", "Type 2 runs on top of an OS that itself runs on the host device", "Type 2 cannot host multiple guest OSs", "Type 2 is exclusively used in bare-metal environments"], "correct": 1, "expl": "A Type 2 hypervisor is software-based and runs on top of an existing operating system that itself runs on the host device, unlike a Type 1 hypervisor which is bare-metal."}, {"n": 41, "cat": "SecResp", "text": "When a user leaves their own virtualized instance and gains access to other virtualized instances on the same host — or even the host itself — what is this called?", "opts": ["Host escape", "Guest escape (VM escape)", "VM introspection", "Containerization breach"], "correct": 1, "expl": "Guest escape, or VM escape, is when a user leaves their own virtualized instance and can access other instances on the same host or affect the host itself."}, {"n": 42, "cat": "SecResp", "text": "VMI (Virtual Machine Introspection) is described as which type of security mechanism?", "opts": ["An agent-based mechanism requiring software installed on each VM", "An agentless means of ensuring a VM's security baseline does not change", "A hardware-only encryption mechanism", "A network firewall replacement"], "correct": 1, "expl": "VMI is an agentless means of ensuring a VM's security baseline does not change, by examining the physical address, network settings, and installed OS."}, {"n": 43, "cat": "SecResp", "text": "Which technology replaces network appliance hardware with virtual machines, using a hypervisor to run networking software such as routing and load balancing?", "opts": ["SDN", "NFV", "CDN", "SAN"], "correct": 1, "expl": "NFV (Network Functions Virtualization) replaces network appliance hardware with VMs, using a hypervisor to run networking software and processes such as routing and load balancing."}, {"n": 44, "cat": "SecResp", "text": "Which SDN capability allows network admins to filter access to resources based on specific rules, reroute traffic based on demand, and create logical subnets without changing physical connections?", "opts": ["NFV", "SDN", "VMI", "NAS"], "correct": 1, "expl": "SDN (Software Defined Networking) uses software-based controllers or APIs to direct traffic, allowing admins to reroute traffic, create logical subnets, and filter resource access without physical changes."}, {"n": 45, "cat": "SecResp", "text": "Which SOC report type is specifically designed for auditing the financial reporting instruments of a corporation, tied to SOX compliance?", "opts": ["SOC 1", "SOC 2", "SOC 3", "SOC 4"], "correct": 0, "expl": "SOC 1 reports are for auditing an organization's financial reporting instruments and are specifically designed to be acceptable for regulatory purposes tied to SOX."}, {"n": 46, "cat": "SecResp", "text": "Which SOC 2 report subtype only reviews the design of controls, without evaluating how they are actually implemented or functioning?", "opts": ["SOC 2 Type 1", "SOC 2 Type 2", "SOC 3", "SOC 1 Type 1"], "correct": 0, "expl": "SOC 2 Type 1 only reviews the design of the controls, not their actual implementation, maintenance, or function — making it less useful for determining an organization's true trust and security posture."}, {"n": 47, "cat": "SecResp", "text": "Which SOC report type is designed to be shared publicly, functioning as a general 'seal of approval' with no detail about the actual controls tested?", "opts": ["SOC 1", "SOC 2 Type 1", "SOC 2 Type 2", "SOC 3"], "correct": 3, "expl": "SOC 3 reports are designed to be shared with the public as a seal of approval, containing no data about the specific security controls — just an assertion that an audit was conducted and passed."}, {"n": 48, "cat": "SecResp", "text": "A distributed computing environment used by only a single customer, and subject to risks like personnel threats, natural disasters, and external attacks, describes which deployment model?", "opts": ["Public cloud", "Private cloud", "Community cloud", "Hybrid cloud"], "correct": 1, "expl": "Private cloud is a distributed computing environment used by only one customer, with risks including personnel threats, natural disasters, external attacks, regulatory noncompliance, and malware."}, {"n": 49, "cat": "App", "text": "Which term describes moving an entire self-contained application to the cloud without making significant changes to it?", "opts": ["Refactoring", "Forklifting", "Replatforming", "Application orchestration"], "correct": 1, "expl": "Forklifting refers to moving an entire self-contained, stand-alone application to the cloud with no significant modifications."}, {"n": 50, "cat": "App", "text": "During the Defining phase of the Cloud-Secure SDLC, what should the team specifically avoid doing?", "opts": ["Identifying business requirements", "Describing aspects of the business needs", "Choosing tools or technologies", "Meeting with stakeholders"], "correct": 2, "expl": "The Defining phase focuses purely on identifying business requirements and needs — teams should not select tools or technologies at this stage."}, {"n": 51, "cat": "App", "text": "Which two types of application security testing occur during the Testing phase of the Cloud-Secure SDLC?", "opts": ["Unit and integration testing", "DAST and SAST", "Regression and smoke testing", "Black box and gray box testing"], "correct": 1, "expl": "The Testing phase uses both DAST (Dynamic Application Security Testing) and SAST (Static Application Security Testing) techniques, alongside functional and security testing."}, {"n": 52, "cat": "App", "text": "What does functional testing ensure, as distinct from security testing?", "opts": ["That the software's security controls are working effectively", "That the software performs its intended tasks completely and accurately in a manner resistant to loss or interruption", "That the source code contains no vulnerabilities", "That the application meets compliance audit standards"], "correct": 1, "expl": "Functional testing ensures the software performs its intended tasks completely and accurately, resistant to loss or interruption, while security testing verifies that included controls are working effectively."}, {"n": 53, "cat": "App", "text": "Under ISO/IEC 27034-1, what is the relationship between the Organizational Normative Framework (ONF) and the Application Normative Framework (ANF)?", "opts": ["Each ANF maps to many ONFs, and each ONF has only one ANF", "Each ANF maps back to exactly one ONF, while one ONF can have many ANFs", "They map one-to-one only", "The ANF replaces the ONF after deployment"], "correct": 1, "expl": "The relationship is one-to-many from ONF to ANF: an ONF can have many ANFs, but each specific application's ANF maps back to only one ONF."}, {"n": 54, "cat": "App", "text": "Which phase of Identity Management involves issuing each subject a unique identity assertion, such as a user ID, along with a password to authenticate it?", "opts": ["Access management", "Provisioning", "Federation", "Authorization"], "correct": 1, "expl": "Provisioning is the first phase of Identity Management, where each subject is issued a unique identity assertion (like a user ID) and a password to authenticate it."}, {"n": 55, "cat": "App", "text": "In a trusted third-party federation model using a CASB, what role do the participating member organizations play?", "opts": ["Identifiers", "Relying parties", "Data controllers", "Data processors"], "correct": 1, "expl": "In this model, the third party (CASB) becomes the identifier that issues and manages identities, while the member organizations act as relying parties — resource providers who share resources based on the third party's approval."}, {"n": 56, "cat": "App", "text": "Which federation standard is XML-based and provides a framework for communicating authentication, authorization, and attribute information across organizations?", "opts": ["OAuth", "SAML", "OpenID Connect", "SCIM"], "correct": 1, "expl": "SAML (Security Assertion Markup Language) is an XML-based federation standard used to communicate authentication, authorization, and attribute information across organizations."}, {"n": 57, "cat": "App", "text": "Which protocol is specifically used for authorization scenarios with mobile apps, providing third-party applications limited access to HTTP services?", "opts": ["SAML", "WS-Federation", "OAuth", "XACML"], "correct": 2, "expl": "OAuth is used in authorization scenarios, particularly with mobile apps, providing third-party applications limited access to HTTP services."}, {"n": 58, "cat": "App", "text": "Which security control functions at Layer 7 of the OSI model and is deployed alongside a network firewall specifically to protect web-based applications?", "opts": ["Stateful packet inspection firewall", "WAF (Web Application Firewall)", "DAM (Database Activity Monitoring)", "XML Gateway"], "correct": 1, "expl": "A WAF operates at Layer 7 of the OSI model and is deployed in addition to a network firewall specifically to protect web-based applications, such as guarding against PCI DSS-relevant threats."}, {"n": 59, "cat": "App", "text": "Which type of API architecture is stateless, client-server, cacheable, and works especially well when bandwidth is limited?", "opts": ["SOAP", "RESTful API", "XML-RPC", "SCIM"], "correct": 1, "expl": "RESTful APIs rely on stateless, client-server, cacheable communication and are well suited to situations where bandwidth is limited or caching is needed."}, {"n": 60, "cat": "App", "text": "Which protocol for exchanging structured web service data is standards-based, XML-reliant, highly intolerant of errors, but well suited for stateful operations?", "opts": ["REST", "SOAP", "JSON-RPC", "SCIM"], "correct": 1, "expl": "SOAP is standards-based and relies on XML; it is slower and highly intolerant of errors compared to REST, but works well for stateful operations and format contracts."}, {"n": 61, "cat": "App", "text": "Which type of testing reviews an application's source code directly and is also known as SAST?", "opts": ["Black-box testing", "White-box testing", "Abuse case testing", "Fuzz testing"], "correct": 1, "expl": "White-box testing, also known as SAST (Static Application Security Testing), involves directly reviewing the application's source code."}, {"n": 62, "cat": "App", "text": "Which attack manipulates a logged-on user's browser into sending a forged HTTP request along with the user's cookies, tricking a vulnerable application into treating the request as legitimate?", "opts": ["SSRF", "CSRF", "SQL injection", "XSS"], "correct": 1, "expl": "CSRF (Cross-Site Request Forgery) manipulates a logged-on user's browser into sending a forged HTTP request with their cookies, deceiving the application into thinking the request is legitimate."}, {"n": 63, "cat": "Ops", "text": "What is the industry service standard for uptime, described as 'five nines,' allowing for less than roughly 6 minutes of downtime per year?", "opts": ["99.9%", "99.99%", "99.999%", "100%"], "correct": 2, "expl": "The industry standard for uptime is 'five nines' (99.999%), which allows for less than approximately 6 minutes of downtime per year."}, {"n": 64, "cat": "Ops", "text": "Which Uptime Institute tier is called 'Basic Site Infrastructure,' requiring at minimum a UPS, sufficient cooling, and a generator with at least 12 hours of fuel, but with little to no redundancy?", "opts": ["Tier 1", "Tier 2", "Tier 3", "Tier 4"], "correct": 0, "expl": "Tier 1, or Basic Site Infrastructure, lists the minimum data center requirements: dedicated IT space, a UPS, sufficient cooling, and a generator with at least 12 hours of fuel — with little to no redundancy."}, {"n": 65, "cat": "Ops", "text": "Which Uptime Institute tier, known as 'Concurrently Maintainable Site Infrastructure,' has multiple distribution paths and dual power supplies so critical operations continue if any single component fails?", "opts": ["Tier 1", "Tier 2", "Tier 3", "Tier 4"], "correct": 2, "expl": "Tier 3, Concurrently Maintainable Site Infrastructure, provides multiple distribution paths and dual power supplies for all IT systems, allowing operations to continue even with a single component failure."}, {"n": 66, "cat": "Ops", "text": "Which specialized chip secures hardware with integrated cryptographic keys, helping prove a user's identity and authenticate devices, while providing security against firmware and ransomware attacks?", "opts": ["HSM", "TPM", "CASB", "IPS"], "correct": 1, "expl": "TPM (Trusted Platform Module) is a specialized chip that secures hardware using integrated cryptographic keys, helping authenticate devices and defend against firmware and ransomware attacks."}, {"n": 67, "cat": "Ops", "text": "In which type of storage cluster are all devices directly connected to a shared physical backplane, which enhances performance as it scales but confines the design to restrictive parameters?", "opts": ["Loosely coupled clusters", "Tightly coupled clusters", "Object clusters", "Data dispersion clusters"], "correct": 1, "expl": "Tightly coupled clusters connect all storage devices directly to a shared physical backplane, which enhances performance as it scales but restricts design flexibility."}, {"n": 68, "cat": "Ops", "text": "Which cloud data protection method slices data into encrypted chunks (shards) with parity bits/erasure coding written across multiple drives, functioning as the cloud equivalent of a RAID array?", "opts": ["RAID", "Data dispersion", "SSMS", "Tightly coupled clustering"], "correct": 1, "expl": "Data dispersion slices data into encrypted shards with parity bits (erasure coding) distributed across cloud cluster drives, serving as the cloud equivalent of a traditional RAID array."}, {"n": 69, "cat": "Ops", "text": "What is the recommended ASHRAE temperature range for a data center?", "opts": ["50-70 degrees F", "64-81 degrees F", "70-90 degrees F", "32-50 degrees F"], "correct": 1, "expl": "The ASHRAE recommended temperature range for data centers is 64-81 degrees Fahrenheit."}, {"n": 70, "cat": "Ops", "text": "When a system enters maintenance mode, what should happen regarding logging?", "opts": ["Logging should be turned off to reduce noise", "Logging should continue, and enhanced logging should begin", "Only fatal-level events should be logged", "Logging should switch entirely to debug mode"], "correct": 1, "expl": "Entering maintenance mode should prevent new logins but ensure logging continues, and enhanced logging should begin during this period."}, {"n": 71, "cat": "Ops", "text": "What distinguishes an 'event' from a 'disaster' in BC/DR terminology?", "opts": ["An event always requires a full BC/DR activation, a disaster does not", "An event's impact lasts three days or less, while a disaster lasts longer", "A disaster is scheduled, an event is not", "There is no meaningful distinction between the two"], "correct": 1, "expl": "An event is an unscheduled impact to the operating environment lasting three days or less; disasters last longer, and an event can escalate into a disaster."}, {"n": 72, "cat": "Ops", "text": "Which BC/DR metric measures how long an interruption can be tolerated before operations stop entirely, also known as activities like system failover and facility evacuation, causing the greatest productivity impact."}, {"n": 77, "cat": "Legal", "text": "Which US law, also known as the Financial Services Modernization Act of 1999, allows banks to merge with insurance companies while requiring that customer account information be kept secure and private?", "opts": ["SOX", "HIPAA", "GLBA", "FERPA"], "correct": 2, "expl": "GLBA (Gramm-Leach-Bliley Act), aka the Financial Services Modernization Act of 1999, allows banks to merge with insurance companies while mandating that customer account information be kept secure and private."}, {"n": 78, "cat": "Legal", "text": "Which US legislation was enacted to protect shareholders and the public from enterprise accounting errors and fraud, expressly naming the traits of the CIA triad in its data security provisions?", "opts": ["GLBA", "SOX", "HIPAA", "DMCA"], "correct": 1, "expl": "SOX (Sarbanes-Oxley Act) was enacted to protect shareholders and the public from accounting errors and fraud, and its data security provisions expressly name CIA triad traits."}, {"n": 79, "cat": "Legal", "text": "Which data element type would immediately reveal a specific individual, such as a Social Security number or home address?", "opts": ["Indirect indicators", "Direct indicators", "Metadata", "Quasi-identifiers"], "correct": 1, "expl": "Direct indicators are data elements that immediately reveal a specific individual, such as SSN, phone number, birthday, or home address."}, {"n": 80, "cat": "Legal", "text": "Which GDPR principle requires that individuals be informed about what PII is being gathered or created about them?", "opts": ["Choice", "Notice", "Access", "Integrity"], "correct": 1, "expl": "The Notice principle under GDPR requires that individuals be informed about PII being gathered or created about them."}];

let state = {
  screen: "start",
  order: [],
  answers: {},
  revealed: {},
  startTime: null,
  endTime: null,
  filter: "all"
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return m + " min " + s + " sec";
}

function levelForPct(pct){
  if(pct >= 90) return "EXEMPLARY";
  if(pct >= 70) return "COMPETENT";
  if(pct >= 50) return "APPROACHING COMPETENCE";
  return "NOT YET COMPETENT";
}
function levelClass(level){
  if(level==="EXEMPLARY") return "EXEMPLARY";
  if(level==="COMPETENT") return "COMPETENT";
  if(level==="APPROACHING COMPETENCE") return "APPROACHING";
  return "NOTCOMPETENT";
}

function render(){
  const app = document.getElementById("app");
  if(state.screen === "start") app.innerHTML = renderStart();
  else if(state.screen === "exam") app.innerHTML = renderExam();
  else if(state.screen === "results") app.innerHTML = renderResults();
  attachHandlers();
}

function renderStart(){
  return `
  <div class="card">
    <h2>Assessment Description</h2>
    <p class="desc">This 80-question practice exam is built directly from your CCSP study notes, covering
    architectural concepts, data classification and cloud data security, security responsibilities across
    deployment models, cloud application security, operations elements and management, and legal, compliance,
    and risk management topics.</p>
    <p class="desc"><strong>Number of questions:</strong> 80 &nbsp;|&nbsp; <strong>Format:</strong> multiple choice, one correct answer per question. You can reveal the correct answer and an explanation for any question at any time using the "Show Answer" button.</p>
    <ul class="desc">
      <li>Architectural Concepts &amp; Design — 20% of assessment</li>
      <li>Data Classification &amp; Cloud Data Security — 20% of assessment</li>
      <li>Security in the Cloud &amp; Responsibilities — 13% of assessment</li>
      <li>Cloud Application Security — 16% of assessment</li>
      <li>Operations Elements &amp; Management — 16% of assessment</li>
      <li>Legal, Compliance &amp; Risk — 16% of assessment</li>
    </ul>
    <button id="startBtn">Start Attempt</button>
  </div>`;
}

function renderExam(){
  const total = state.order.length;
  const answeredCount = Object.keys(state.answers).length;
  const pct = Math.round((answeredCount/total)*100);
  let qHtml = "";
  state.order.forEach((qIdx, i)=>{
    const q = QUESTIONS[qIdx];
    const selected = state.answers[q.n];
    const isRevealed = !!state.revealed[q.n];
    qHtml += `<div class="card" data-qn="${q.n}">
      <div class="tag">${COMPETENCIES[q.cat].name}</div>
      <div class="qtext"><span class="qnum">${i+1}.</span>${q.text}</div>
      ${q.opts.map((opt,oi)=>{
        let cls = "opt";
        if(isRevealed){
          if(oi===q.correct) cls += " reveal-correct";
          else if(oi===selected) cls += " reveal-wrong-selected";
        } else if(selected===oi){
          cls += " selected";
        }
        return `<label class="${cls}">
          <input type="radio" name="q${q.n}" value="${oi}" ${selected===oi?'checked':''} ${isRevealed?'disabled':''}>
          ${opt}
        </label>`;
      }).join("")}
      <div class="explain-toggle-row">
        <button class="secondary small" data-showans="${q.n}">${isRevealed ? "Hide Answer" : "Show Answer"}</button>
      </div>
      ${isRevealed ? `<div class="explain-box"><strong>Correct answer:</strong> ${q.opts[q.correct]}<br><br>${q.expl}</div>` : ""}
    </div>`;
  });
  return `
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">${answeredCount} of ${total} answered</div>
  </div>
  ${qHtml}
  <div class="card" style="text-align:center;">
    <button id="submitBtn">Submit Assessment</button>
  </div>`;
}

function computeResults(){
  let correctTotal = 0;
  const byCat = {};
  Object.keys(COMPETENCIES).forEach(c=> byCat[c] = {correct:0, total:0});
  QUESTIONS.forEach(q=>{
    byCat[q.cat].total++;
    const userAns = state.answers[q.n];
    if(userAns === q.correct){ correctTotal++; byCat[q.cat].correct++; }
  });
  const overallPct = Math.round((correctTotal/QUESTIONS.length)*100);
  return {correctTotal, overallPct, byCat};
}

function renderResults(){
  const {correctTotal, overallPct, byCat} = computeResults();
  const elapsedSec = Math.max(1, Math.round((state.endTime - state.startTime)/1000));
  const passed = overallPct >= 70;

  let compHtml = "";
  Object.keys(COMPETENCIES).forEach(c=>{
    const info = COMPETENCIES[c];
    const stat = byCat[c];
    const pct = stat.total ? Math.round((stat.correct/stat.total)*100) : 0;
    const level = levelForPct(pct);
    compHtml += `<div class="comp-row">
      <div class="comp-name">${info.name} <span style="color:var(--muted);font-weight:400;">— ${info.weight}% of assessment</span></div>
      <div class="comp-pct">${stat.correct}/${stat.total} (${pct}%)</div>
      <span class="pill ${levelClass(level)}">${level}</span>
    </div>`;
  });

  const cats = Object.keys(COMPETENCIES);
  let filterHtml = `<div class="filterbar">
    <button data-f="all" class="${state.filter==='all'?'active':''}">All (${QUESTIONS.length})</button>
    <button data-f="incorrect" class="${state.filter==='incorrect'?'active':''}">Incorrect only</button>
    ${cats.map(c=>`<button data-f="${c}" class="${state.filter===c?'active':''}">${COMPETENCIES[c].name}</button>`).join("")}
  </div>`;

  let reviewHtml = "";
  QUESTIONS.forEach((q,i)=>{
    const userAns = state.answers[q.n];
    const isCorrect = userAns === q.correct;
    if(state.filter === "incorrect" && isCorrect) return;
    if(state.filter !== "all" && state.filter !== "incorrect" && q.cat !== state.filter) return;
    reviewHtml += `<div class="answer-block ${isCorrect?'correct':'incorrect'}">
      <div class="tag">${COMPETENCIES[q.cat].name} — ${isCorrect?'Correct':'Incorrect'}</div>
      <div class="qtext">${q.n}. ${q.text}</div>
      ${q.opts.map((opt,oi)=>{
        let cls = "";
        if(oi===userAns && oi===q.correct) cls="both";
        else if(oi===userAns) cls="your";
        else if(oi===q.correct) cls="correctans";
        if(!cls) return `<div class="ans-opt">${opt}</div>`;
        const labelExtra = (oi===userAns && oi!==q.correct) ? " (your answer)" : (oi===q.correct ? " (correct answer)" : "");
        return `<div class="ans-opt ${cls}">${opt}${labelExtra}</div>`;
      }).join("")}
      <div class="explain-box"><strong>Explanation:</strong> ${q.expl}</div>
    </div>`;
  });

  return `
  <div class="card">
    <div class="tag">Coaching Report — CCSP Notes Practice Exam</div>
    <h2 style="margin:6px 0 2px;">Attempt ${state.attemptNum || 1} Results</h2>
    <p class="desc">Time used: ${fmtTime(elapsedSec)} &nbsp;|&nbsp; # of Questions: ${QUESTIONS.length}</p>
    <div style="display:flex;align-items:baseline;gap:16px;margin:14px 0;">
      <div class="summary-score">${overallPct}%</div>
      <div>
        <div style="font-weight:700;font-size:1.1rem;" class="${passed?'status-pass':'status-fail'}">${passed?'PASSED':'NOT PASSED'}</div>
        <div class="desc">${correctTotal} of ${QUESTIONS.length} correct</div>
      </div>
    </div>
  </div>
  <div class="card">
    <h3 style="margin-top:0;">Competencies and Topics</h3>
    ${compHtml}
  </div>
  <div class="card">
    <h3 style="margin-top:0;">Question Review</h3>
    ${filterHtml}
    ${reviewHtml || '<p class="desc">No questions match this filter.</p>'}
  </div>
  <div class="card" style="text-align:center;">
    <button class="secondary" id="retakeBtn">Retake Assessment</button>
  </div>`;
}

function attachHandlers(){
  const startBtn = document.getElementById("startBtn");
  if(startBtn){
    startBtn.onclick = ()=>{
      state.order = shuffle(QUESTIONS.map((q,i)=>i));
      state.answers = {};
      state.revealed = {};
      state.startTime = Date.now();
      state.screen = "exam";
      render();
      window.scrollTo(0,0);
    };
  }
  document.querySelectorAll('.card[data-qn] input[type=radio]').forEach(inp=>{
    inp.onchange = (e)=>{
      const qn = parseInt(e.target.closest('.card').dataset.qn,10);
      state.answers[qn] = parseInt(e.target.value,10);
      render();
    };
  });
  document.querySelectorAll('[data-showans]').forEach(btn=>{
    btn.onclick = ()=>{
      const qn = parseInt(btn.dataset.showans,10);
      state.revealed[qn] = !state.revealed[qn];
      render();
    };
  });
  const submitBtn = document.getElementById("submitBtn");
  if(submitBtn){
    submitBtn.onclick = ()=>{
      const total = QUESTIONS.length;
      const answered = Object.keys(state.answers).length;
      if(answered < total){
        if(!confirm(`You have answered ${answered} of ${total} questions. Submit anyway?`)) return;
      }
      state.endTime = Date.now();
      state.attemptNum = (state.attemptNum||0) + 1;
      state.screen = "results";
      state.filter = "all";
      render();
      window.scrollTo(0,0);
    };
  }
  const retakeBtn = document.getElementById("retakeBtn");
  if(retakeBtn){
    retakeBtn.onclick = ()=>{
      state.screen = "start";
      render();
      window.scrollTo(0,0);
    };
  }
  document.querySelectorAll('.filterbar button').forEach(b=>{
    b.onclick = ()=>{
      state.filter = b.dataset.f;
      render();
    };
  });
}

render();
</script>
</body>
</html>
